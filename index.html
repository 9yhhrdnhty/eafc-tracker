<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAFC Tracker</title>

<style>
/* ---------- GLOBAL ---------- */
html {
    touch-action: manipulation;
}

body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #050608;
    color: #e5e7eb;
    margin: 32px auto;
    max-width: 960px;
    padding: 0 16px;
}

/* EAFC minimal clean vibe */
h1 {
    text-align: center;
    color: #22c55e;
    margin-bottom: 8px;
    letter-spacing: 0.08em;
    font-size: 24px;
    text-transform: uppercase;
}

.subtitle {
    text-align: center;
    color: #9ca3af;
    font-size: 13px;
    margin-bottom: 24px;
}

/* ---------- GLOBAL PROGRESS ---------- */
.global-panel {
    background: #0b0f16;
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 20px;
    border: 1px solid #1f2937;
    box-shadow: 0 18px 40px rgba(0,0,0,0.55);
}

.global-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.global-title {
    font-size: 14px;
    font-weight: 600;
    color: #e5e7eb;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.global-stats {
    font-size: 12px;
    color: #9ca3af;
}

.global-bar {
    height: 12px;
    background: #111827;
    border-radius: 999px;
    overflow: hidden;
}

.global-fill {
    height: 100%;
    background: linear-gradient(90deg, #22c55e, #4ade80);
    width: 0%;
    transition: width .25s ease-out;
}

/* ---------- CATEGORY TABS ---------- */
.category-tabs {
    display: flex;
    gap: 8px;
    margin: 18px 0;
    flex-wrap: wrap;
}

.category-tab {
    padding: 8px 14px;
    border-radius: 999px;
    background: #0b0f16;
    border: 1px solid #1f2937;
    color: #9ca3af;
    font-size: 13px;
    cursor: pointer;
    transition: .2s;
}

.category-tab.active {
    background: #22c55e;
    border-color: #22c55e;
    color: #020617;
    font-weight: 600;
}

/* ---------- ACTIVE/COMPLETED TOGGLE ---------- */
.view-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
}

.view-btn {
    padding: 6px 12px;
    border-radius: 999px;
    background: #0b0f16;
    border: 1px solid #1f2937;
    color: #9ca3af;
    font-size: 12px;
    cursor: pointer;
    transition: .2s;
}

.view-btn.active {
    background: #22c55e;
    border-color: #22c55e;
    color: #020617;
    font-weight: 600;
}

/* ---------- CREATOR ---------- */
.creator {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    background: #050b12;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid #1f2937;
    box-shadow: 0 12px 30px rgba(0,0,0,0.55);
    width: 100%;
    box-sizing: border-box;
}

.creator input {
    padding: 10px;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    flex: 1;
    background: #0b1120;
    color: #e5e7eb;
    min-width: 0;
}

.creator input::placeholder {
    color: #6b7280;
}

.creator input:focus {
    outline: 1px solid #22c55e;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    transition: .2s;
    font-size: 16px;
    touch-action: manipulation;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

.addBtn {
    background: #22c55e;
    color: #020617;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
}

.addBtn:hover {
    background: #4ade80;
}

/* ---------- CARD ---------- */
.card {
    position: relative;
    background: #050b12;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    border: 1px solid #1f2937;
    box-shadow: 0 14px 32px rgba(0,0,0,0.6);
    transition: .2s;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.card:hover {
    transform: translateY(-2px);
    border-color: #22c55e;
}

.title {
    font-size: 18px;
    margin-bottom: 8px;
    font-weight: 600;
    color: #e5e7eb;
}

.category-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #6b7280;
    margin-bottom: 4px;
}

.progressText {
    margin: 4px 0;
    font-size: 13px;
    color: #9ca3af;
}

/* ---------- CONTROLS ---------- */
.controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
}

.minus, .plus {
    width: 40px;
    height: 40px;
    font-size: 22px;
    border-radius: 999px;
    font-weight: 600;
}

.minus {
    background: #ef4444;
    color: #020617;
}

.plus {
    background: #22c55e;
    color: #020617;
}

.delete {
    margin-left: auto;
    background: #111827;
    color: #e5e7eb;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
}

/* ---------- PROGRESS BAR ---------- */
.bar {
    height: 10px;
    background: #0b1120;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 12px;
}

.fill {
    height: 100%;
    background: linear-gradient(90deg, #22c55e, #4ade80);
    width: 0%;
    transition: width .25s ease-out;
}

/* ---------- SETTINGS PAGE ---------- */
#settingsPanel {
    display: none;
}

/* ---------- MOBILE ---------- */
@media (max-width: 600px) {
    body {
        margin: 20px auto;
        padding: 0 10px;
    }

    .creator {
        flex-direction: column;
        align-items: stretch;
    }

    .creator input,
    .creator button {
        width: 100%;
    }

    .card {
        padding: 16px;
    }

    .controls {
        gap: 8px;
    }

    .minus, .plus {
        width: 44px;
        height: 44px;
        font-size: 24px;
    }
}
</style>
</head>

<body>

<h1>EAFC Tracker</h1>
<div class="subtitle">Objectives • Milestones • SBCs • Daily Tasks</div>

<div class="global-panel">
    <div class="global-header">
        <div class="global-title">Overall Progress</div>
        <div class="global-stats" id="globalStats">0 / 0 (0%)</div>
    </div>
    <div class="global-bar">
        <div class="global-fill" id="globalFill"></div>
    </div>
</div>

<div class="category-tabs">
    <div class="category-tab active" data-cat="objectives" onclick="switchCategory('objectives')">Objectives</div>
    <div class="category-tab" data-cat="milestones" onclick="switchCategory('milestones')">Milestones</div>
    <div class="category-tab" data-cat="sbcs" onclick="switchCategory('sbcs')">SBCs</div>
    <div class="category-tab" data-cat="daily" onclick="switchCategory('daily')">Daily Tasks</div>
    <div class="category-tab" data-cat="settings" onclick="switchCategory('settings')">Settings</div>
</div>

<div class="view-toggle">
    <div class="view-btn active" data-view="active" onclick="switchView('active')">Active</div>
    <div class="view-btn" data-view="completed" onclick="switchView('completed')">Completed</div>
</div>

<div class="creator">
    <input id="name" placeholder="Objective Name">
    <input id="qty" type="number" inputmode="numeric" pattern="[0-9]*" min="1" placeholder="Quantity">
    <button class="addBtn" onclick="addObjective()">Add</button>
</div>

<div id="list"></div>

<!-- SETTINGS PAGE -->
<div id="settingsPanel">
    <div class="card">
        <div class="title">Settings</div>
        <div class="progressText">Manage your EAFC Tracker data</div>

        <button class="delete" onclick="wipeAllData()" style="margin-top:20px;">
            Wipe All Objective Data
        </button>
    </div>
</div>

<script>
/* ---------- DATA MODEL ---------- */
const STORAGE_KEY = "eafc25Tracker";

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    objectives: { active: [], completed: [] },
    milestones: { active: [], completed: [] },
    sbcs: { active: [], completed: [] },
    daily: { active: [], completed: [] }
};

let currentCategory = "objectives";
let currentView = "active";

/* ---------- UTIL ---------- */
function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    updateGlobalProgress();
}

function vibrate(ms = 20) {
    if (navigator.vibrate) {
        navigator.vibrate([ms]);
    }
}

/* ---------- CATEGORY / VIEW ---------- */
function switchCategory(cat) {
    currentCategory = cat;

    document.querySelectorAll(".category-tab").forEach(tab => {
        tab.classList.toggle("active", tab.dataset.cat === cat);
    });

    if (cat === "settings") {
        document.getElementById("list").style.display = "none";
        document.getElementById("settingsPanel").style.display = "block";
    } else {
        document.getElementById("settingsPanel").style.display = "none";
        document.getElementById("list").style.display = "block";
        render();
    }
}

function switchView(view) {
    currentView = view;

    document.querySelectorAll(".view-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === view);
    });

    render();
}

/* ---------- ADD OBJECTIVE ---------- */
function addObjective() {
    const name = document.getElementById("name").value.trim();
    const qty = parseInt(document.getElementById("qty").value);

    if (name === "" || !qty || qty < 1) {
        alert("Enter a valid name and quantity.");
        return;
    }

    data[currentCategory].active.push({
        name: name,
        target: qty,
        progress: 0
    });

    vibrate(40);
    save();
    render();

    document.getElementById("name").value = "";
    document.getElementById("qty").value = "";
}

/* ---------- PROGRESS CONTROLS ---------- */
function plus(index) {
    let o = data[currentCategory].active[index];

    if (!o) return;

    if (o.progress < o.target) {
        o.progress++;
    }

    if (o.progress >= o.target) {
        data[currentCategory].completed.push(o);
        data[currentCategory].active.splice(index, 1);
    }

    vibrate(20);
    save();
    render();
}

function minus(index) {
    let o = data[currentCategory].active[index];

    if (!o) return;

    if (o.progress > 0) {
        o.progress--;
    }

    vibrate(15);
    save();
    render();
}

/* ---------- DELETE ---------- */
function removeActive(index) {
    if (!confirm("Delete this objective?")) return;

    data[currentCategory].active.splice(index, 1);
    vibrate(40);
    save();
    render();
}

function removeCompleted(index) {
    if (!confirm("Delete this completed objective?")) return;

    data[currentCategory].completed.splice(index, 1);
    vibrate(40);
    save();
    render();
}

/* ---------- WIPE ALL DATA ---------- */
function wipeAllData() {
    if (!confirm("Are you sure you want to wipe ALL objective data?")) return;

    vibrate(50);

    data = {
        objectives: { active: [], completed: [] },
        milestones: { active: [], completed: [] },
        sbcs: { active: [], completed: [] },
        daily: { active: [], completed: [] }
    };

    save();
    render();

    alert("All EAFC Tracker data has been wiped.");
}

/* ---------- GLOBAL PROGRESS ---------- */
function updateGlobalProgress() {
    let totalTarget = 0;
    let totalProgress = 0;

    for (const cat of ["objectives", "milestones", "sbcs", "daily"]) {
        const active = data[cat].active;

        active.forEach(o => {
            totalTarget += o.target;
            totalProgress += o.progress;
        });
    }

    const percent = totalTarget === 0 ? 0 : Math.round((totalProgress / totalTarget) * 100);

    const statsEl = document.getElementById("globalStats");
    const fillEl = document.getElementById("globalFill");

    statsEl.textContent = `${totalProgress} / ${totalTarget} (${percent}%)`;
    fillEl.style.width = `${percent}%`;
}

/* ---------- RENDER ---------- */
function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    const catData = data[currentCategory];
    const items = currentView === "active" ? catData.active : catData.completed;

    const categoryNames = {
        objectives: "Objectives",
        milestones: "Milestones",
        sbcs: "SBCs",
        daily: "Daily Tasks"
    };

    items.forEach((o, index) => {
        const percent = (o.progress / o.target) * 100;
        const remaining = Math.max(0, o.target - o.progress);

        list.innerHTML += `
<div class="card">
    <div>
        <div class="category-label">${categoryNames[currentCategory]}</div>
        <div class="title">${o.name}</div>

        <div class="progressText">
            Progress: <strong>${o.progress}</strong> / ${o.target}
        </div>

        <div class="progressText">
            Remaining: <strong>${remaining}</strong>
        </div>
    </div>

    ${currentView === "active" ? `
    <div class="controls">
        <button class="minus" onclick="minus(${index})">−</button>
        <button class="plus" onclick="plus(${index})">+</button>
        <button class="delete" onclick="removeActive(${index})">Delete</button>
    </div>
    ` : `
    <div class="controls">
        <button class="delete" onclick="removeCompleted(${index})">Delete</button>
    </div>
    `}

    <div class="bar">
        <div class="fill" style="width:${percent}%"></div>
    </div>
</div>
        `;
    });

    updateGlobalProgress();
}

/* ---------- INIT ---------- */
render();
</script>

</body>
</html>
